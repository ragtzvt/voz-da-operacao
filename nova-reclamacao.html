<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Sugestão - Voz da Operação</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for modern icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Background glow particles for premium aesthetic -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="app-container">
        <!-- 2. TELA DE NOVA SUGESTÃO -->
        <main class="container-form glass-card" id="newComplaintSection">
            
            <!-- ====== BOTÃO DE VOLTAR ====== -->
            <button type="button" class="btn btn-secondary-outline" id="backToMuralBtn" style="margin-bottom: 20px; cursor: pointer;">
                <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Voltar para o Mural
            </button>

            <div class="panel-header">
                <div class="panel-title-wrapper">
                    <div class="icon-badge">
                        <i class="fa-regular fa-comment-dots"></i>
                    </div>
                    <h2>Nova Sugestão</h2>
                </div>
                <p class="panel-subtitle">Conte-nos qual é a oportunidade de melhoria ou problema na sua rotina.</p>
            </div>

            <form id="complaintForm" class="interactive-form">
                <div class="form-group">
                    <label for="complaintTitle">Título curto da sugestão</label>
                    <div class="input-wrapper">
                        <input type="text" id="complaintTitle" placeholder="Ex: Melhoria no fluxo de impressão de etiquetas" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="complaintDescription">Detalhes da sugestão / impacto</label>
                    <div class="input-wrapper">
                        <textarea id="complaintDescription" maxlength="300" placeholder="Descreva brevemente como esta ideia pode otimizar seu trabalho ou resolver um gargalo..." required></textarea>
                        <div class="char-counter">
                            <span id="charCount">0</span>/300
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="complaintStage">Qual etapa / processo afeta</label>
                    <div class="input-wrapper">
                        <select id="complaintStage" required>
                            <option value="" disabled selected>Carregando etapas...</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="complaintArea">Área impactada <span class="required-badge">*</span></label>
                    <div class="input-wrapper">
                        <select id="complaintArea" required>
                            <option value="" disabled selected>Carregando áreas...</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="complaintTool">Ferramenta que pode ser melhorada <span class="required-badge">*</span></label>
                    <div class="input-wrapper">
                        <select id="complaintTool" required>
                            <option value="" disabled selected>Carregando ferramentas...</option>
                        </select>
                    </div>
                </div>

                <!-- CAMPO DINÂMICO PARA "OUTROS..." -->
                <div class="form-group" id="customToolGroup" style="display: none; margin-top: 15px;">
                    <label for="customToolInput">Qual a ferramenta? <span class="required-badge">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="customToolInput" placeholder="Digite o nome da nova ferramenta...">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-submit" style="margin-top: 20px;">
                    <span>Enviar Sugestão</span>
                    <i class="fa-regular fa-paper-plane"></i>
                </button>
            </form>
        </main>
    </div>

    <!-- Notification Toast Element -->
    <div id="toast" class="toast hidden">
        <div class="toast-content">
            <i class="fa-regular fa-circle-check toast-icon"></i>
            <span id="toastMessage">Operação realizada com sucesso!</span>
        </div>
    </div>

    <!-- Supabase Integration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
