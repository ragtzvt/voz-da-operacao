<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Voz da Operação</title>
    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <div class="app-container">
        <!-- SEÇÃO DE LOGIN -->
        <main class="container-auth glass-card" id="loginSection">
            <div class="panel-header">
                <div class="panel-title-wrapper">
                    <div class="icon-badge">
                        <i class="fa-solid fa-right-to-bracket"></i>
                    </div>
                    <h2>Voz da Operação</h2>
                </div>
                <p class="panel-subtitle">Acesse com sua conta corporativa para enviar e visualizar sugestões.</p>
            </div>

            <form id="loginForm" class="interactive-form">
                <div class="form-group">
                    <label for="loginEmail">E-mail Corporativo</label>
                    <div class="input-wrapper">
                        <input type="email" id="loginEmail" placeholder="seu.nome@usereserva.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="loginPassword" placeholder="Sua senha de acesso" required>
                        <button type="button" class="btn-toggle-pw" id="togglePasswordBtn">
                            <i class="fa-regular fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <span>Entrar no Sistema</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <div class="auth-footer" style="margin-top: 20px; text-align: center;">
                <p>Ainda não tem uma conta? <a href="#" id="linkToRegister" style="color: var(--accent-color); font-weight: 600;">Cadastre-se</a></p>
            </div>
        </main>

        <!-- SEÇÃO DE CADASTRO -->
        <main class="container-auth glass-card" id="registerSection" style="display: none;">
            <div class="panel-header">
                <div class="panel-title-wrapper">
                    <div class="icon-badge">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <h2>Criar Conta</h2>
                </div>
                <p class="panel-subtitle">Cadastre-se com seu e-mail corporativo para acessar o painel de sugestões.</p>
            </div>

            <form id="registerForm" class="interactive-form">
                <div class="form-group">
                    <label for="regEmail">E-mail Corporativo <span class="required-badge">*</span></label>
                    <div class="input-wrapper">
                        <input type="email" id="regEmail" placeholder="seu.nome@usereserva.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regPassword">Senha <span class="required-badge">*</span></label>
                    <div class="input-wrapper">
                        <input type="password" id="regPassword" placeholder="Crie uma senha forte" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regArea">Sua Área / Setor <span class="required-badge">*</span></label>
                    <div class="input-wrapper">
                        <select id="regArea" required>
                            <option value="" disabled selected>Carregando setores...</option>
                        </select>
                    </div>
                </div>

                <!-- CAMPO DINÂMICO PARA OUTROS SETORES -->
                <div class="form-group" id="customAreaGroup" style="display: none; margin-top: 15px;">
                    <label for="customAreaInput">Qual é a sua Área / Setor? <span class="required-badge">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="customAreaInput" placeholder="Digite o nome do seu setor...">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">
                    <span>Finalizar Cadastro</span>
                    <i class="fa-solid fa-check"></i>
                </button>
            </form>

            <div class="auth-footer" style="margin-top: 20px; text-align: center;">
                <p>Já possui uma conta? <a href="#" id="linkToLogin" style="color: var(--accent-color); font-weight: 600;">Fazer Login</a></p>
            </div>
        </main>
    </div>

    <!-- Notification Toast Element -->
    <div id="toast" class="toast hidden">
        <div class="toast-content">
            <i class="fa-regular fa-circle-check toast-icon"></i>
            <span id="toastMessage">Operação realizada com sucesso!</span>
        </div>
    </div>

    <!-- Supabase Integration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
